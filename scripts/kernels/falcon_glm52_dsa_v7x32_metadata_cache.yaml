name: glm52-dsa-v7x32-metadata-cache-20260719-v1
exp_type: TRAINING
cluster_name: tpu-training-antgroup
artifact_type: GCS
tags:
  - sglang-jax
  - glm-5.2
  - dsa
  - precompile
  - metadata-cache
  - real-e2e
  - v7x-32
config: '{"source_rev":"16d3a7f09","purpose":"fresh-node GLM-5.2 DSA metadata-sidecar and precompile repeated 3072-token E2E"}'
role_to_task_spec:
  worker:
    replica: 4
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x4
    supply_mode: reservation
    envs:
      PYTHONUNBUFFERED: "1"
      TMPDIR: /tmp/tpu_logs/tmp
      PIP_CACHE_DIR: /tmp/tpu_logs/pip-cache
      UV_CACHE_DIR: /tmp/tpu_logs/uv-cache
      JAX_COMPILATION_CACHE_DIR: /tmp/tpu_logs/jax-cache
      JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
      LIBTPU_INIT_ARGS: --xla_tpu_dvfs_p_state=7
      SGLANG_JAX_METADATA_SCAN_THREADS: "32"
      SGLANG_MOE_RANGE_LOAD_WORKERS: "32"
    command: |
      bash <<'BASH'
      set -euxo pipefail
      ulimit -c 0

      ROOT=/tmp/glm52-dsa-v7x32/sglang-jax
      SOURCE=/models/codex-sources/sglang-jax-glm52-dsa-16d3a7f09.tar.gz
      mkdir -p /tmp/tpu_logs/tmp /tmp/tpu_logs/pip-cache /tmp/tpu_logs/uv-cache /tmp/tpu_logs/jax-cache
      rm -rf "$ROOT"
      mkdir -p "$ROOT"
      echo '1f864d122702d364d3c843c310fb611d1d07ca37f5aaa33bfe9482de8f53eb9c  '"$SOURCE" | sha256sum -c -
      tar -xzf "$SOURCE" -C "$ROOT"
      /opt/venv/bin/python3 -m pip install --disable-pip-version-check -e "$ROOT/python"

      export GLM52_DSA_ROOT="$ROOT"
      export GLM52_DSA_PYBIN=/opt/venv/bin/python3
      export GLM52_DSA_RUN_ID=glm52-dsa-metadata-cache-20260719-001
      export GLM52_DSA_SOURCE_REV=16d3a7f09
      export GLM52_ATTENTION_BACKEND=dsa
      export GLM52_DSA_REQUEST_PROFILE=precompile_repeat
      export GLM52_DSA_MAX_NEW_TOKENS=1
      export GLM52_DSA_GENERATE_TIMEOUT_SECONDS=3600
      export GLM52_DSA_HEALTH_TIMEOUT_SECONDS=10800
      export SGLANG_JAX_SKIP_GCSFUSE_WARMUP=1
      exec bash "$ROOT/scripts/kernels/run_glm52_dsa_v7x32_real_e2e.sh"
      BASH
    mounts:
      - name: model-storage
        type: gcs
        bucket: inference-model-storage-poc-tpu-hns
        mount_path: /models
        read_only: true
        mount_options:
          - implicit-dirs
          - metadata-cache:ttl-secs:-1
          - metadata-cache:stat-cache-max-size-mb:512
          - metadata-cache:type-cache-max-size-mb:64
          - file-cache:max-size-mb:10240
          - file-cache:cache-file-for-range-read:false
          - file-system:kernel-list-cache-ttl-secs:-1
          - file-cache:enable-parallel-downloads:true
          - file-cache:parallel-downloads-per-file:32
          - read_ahead_kb=1024

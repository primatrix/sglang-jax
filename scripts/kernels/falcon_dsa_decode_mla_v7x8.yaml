name: dsa-perf-matrix-v7x8-20260715-r1
exp_type: profiling
cluster_name: tpuv7x-64-node
artifact_type: GCS
tags:
  - dsa
  - mla
  - pallas
  - correctness
  - performance
role_to_task_spec:
  worker:
    replica: 1
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x1
    supply_mode: reservation
    envs:
      PYTHONUNBUFFERED: "1"
      TMPDIR: /tmp/dsa-decode-mla/tmp
      PIP_CACHE_DIR: /tmp/dsa-decode-mla/pip-cache
      JAX_COMPILATION_CACHE_DIR: /tmp/dsa-decode-mla/jit-cache
      # JAX 0.8.1/libtpu 0.0.30 does not accept the newer LLO trace flags.
      # jax.profiler.trace() below still captures a standard XProf trace.
      LIBTPU_INIT_ARGS: --xla_tpu_dvfs_p_state=7
    command: |
      bash -lc '
      set -euxo pipefail
      ROOT=/tmp/dsa-decode-mla
      RESULTS=${ROOT}/results
      mkdir -p "${ROOT}/tmp" "${ROOT}/pip-cache" "${ROOT}/jit-cache" "${RESULTS}"
      ulimit -c 0

      git clone --depth 1 --branch develop/dsa-decode-mla \
        https://github.com/primatrix/sglang-jax.git "${ROOT}/repo"
      cd "${ROOT}/repo"
      git rev-parse HEAD | tee "${RESULTS}/git_head.txt"
      python -m pip install -U "jax[tpu]==0.8.1" \
        -i https://us-python.pkg.dev/ml-oss-artifacts-published/jax/simple/ \
        -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
      python -m pip install --no-deps -e python
      python - <<"PY" | tee "${RESULTS}/environment.txt"
      import jax
      print(f"backend={jax.default_backend()}")
      print(f"jax={jax.__version__}")
      print(f"devices={jax.devices()}")
      PY

      for BATCH in 1 8 32; do
        for CONTEXT in 8000 32000 128000 160000; do
          PROFILE_ARGS=()
          if [[ "${BATCH}" == 1 && "${CONTEXT}" == 160000 ]] || \
             [[ "${BATCH}" == 32 && "${CONTEXT}" == 32000 ]]; then
            PROFILE_ARGS=(
              --profile --profile-iters 3 --profile-variant sparsecore
              --profile-dir "${RESULTS}/profile_b${BATCH}_ctx${CONTEXT}"
            )
          fi
          python benchmark/kernels/mla/bench_dsa_decode_mla.py \
            --batch-size "${BATCH}" --context-length "${CONTEXT}" --top-k 2048 \
            --slot-distribution uniform --variant all \
            --warmup-iters 50 --iters 200 \
            --output "${RESULTS}/uniform_b${BATCH}_ctx${CONTEXT}.json" \
            "${PROFILE_ARGS[@]}" \
            2>&1 | tee "${RESULTS}/uniform_b${BATCH}_ctx${CONTEXT}.log"
        done
      done

      for BATCH in 1 32; do
        python benchmark/kernels/mla/bench_dsa_decode_mla.py \
          --batch-size "${BATCH}" --context-length 160000 --top-k 2048 \
          --slot-distribution clustered --variant all \
          --warmup-iters 50 --iters 200 \
          --output "${RESULTS}/clustered_b${BATCH}_ctx160000.json" \
          2>&1 | tee "${RESULTS}/clustered_b${BATCH}_ctx160000.log"
      done
      '
